name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
