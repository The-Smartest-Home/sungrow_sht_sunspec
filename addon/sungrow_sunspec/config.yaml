name: Sungrow SHx SunSpec bridge
version: "0.3.12"
slug: sungrow_shx_sunspec
description: Read Sungrow SH-series inverter data over Modbus TCP, expose SunSpec models, and show a live dashboard.
url: https://github.com/The-Smartest-Home/sungrow_sht_sunspec
stage: experimental
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
ports:
  "5020/tcp": 502
ports_description:
  "5020/tcp": SunSpec Modbus TCP host port (default 502; configurable)
panel_icon: mdi:solar-power-variant
panel_title: Sungrow SunSpec
map:
  - type: app_config
    read_only: true
options:
  inverter_host: ""
  inverter_port: 502
  unit_id: 1
  refresh_interval: 5
  allowed_clients: 127.0.0.1/32,::1/128
  register_map_file: /app/profiles/sh25t_shb.community.json
  expose_model_103: true
  expose_model_124: true
  expose_model_203: true
schema:
  inverter_host: str
  inverter_port: port
  unit_id: int(1,247)
  refresh_interval: int(1,300)
  allowed_clients: str
  register_map_file: str
  expose_model_103: bool
  expose_model_124: bool
  expose_model_203: bool
