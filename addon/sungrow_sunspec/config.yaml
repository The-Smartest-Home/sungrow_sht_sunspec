name: Sungrow SHx SunSpec bridge
version: "0.1.0"
slug: sungrow_shx_sunspec
description: Read Sungrow SH-series inverter data over Modbus TCP and expose SunSpec Modbus TCP models.
url: https://github.com/The-Smartest-Home/sungrow_sht_sunspec
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
host_network: true
map:
  - type: app_config
    read_only: true
options:
  inverter_host: ""
  inverter_port: 502
  unit_id: 1
  refresh_interval: 5
  sunspec_port: 5020
  register_map_file: /app/profiles/sh25t_shb.community.json
schema:
  inverter_host: str
  inverter_port: port
  unit_id: int(1,247)
  refresh_interval: int(1,300)
  sunspec_port: port
  register_map_file: str
